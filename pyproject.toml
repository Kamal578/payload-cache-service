[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "payload-cache-service"
version = "0.1.0"
description = "A persistent string transformation cache with a FastAPI API and CLI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "pydantic-settings>=2.8,<3",
  "sqlalchemy>=2.0,<3",
  "uvicorn>=0.34,<1",
]

[project.scripts]
cache-cli = "payload_cache.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "mypy>=1.15,<2"]

[tool.hatch.build.targets.wheel]
packages = ["src/payload_cache"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
